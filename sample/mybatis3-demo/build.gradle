plugins {
    id 'java'
}

group 'com.baomidou.sample.mybatis-plus3'
version '1.1.0'

repositories {
    mavenLocal()
    maven { url 'http://maven.aliyun.com/nexus/content/groups/public/'
        allowInsecureProtocol = true }
    maven { url 'http://maven.aliyun.com/nexus/content/repositories/jcenter'
        allowInsecureProtocol = true}
    mavenCentral()
}


dependencies {
    implementation "org.springframework.boot:spring-boot-starter:2.3.2.RELEASE"
    implementation "com.baomidou:mybatis-plus-boot-starter:3.3.0"
    // https://mvnrepository.com/artifact/javax.persistence/javax.persistence-api
    implementation "javax.persistence:javax.persistence-api:2.2"
    testImplementation "org.springframework.boot:spring-boot-starter-test:2.3.2.RELEASE"
    testImplementation "junit:junit:4.10"
    testImplementation "com.h2database:h2:1.4.200"
    // https://mvnrepository.com/artifact/org.projectlombok/lombok
    implementation "org.projectlombok:lombok:1.18.8"

}


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

test{
    useJUnitPlatform()
}

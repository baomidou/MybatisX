plugins {
    id 'java'
}

group 'com.baomidou.sample.mybatis-plus2'
version '1.1.0'

repositories {
    mavenLocal()
    maven { url 'http://maven.aliyun.com/nexus/content/groups/public/' }
    maven { url 'http://maven.aliyun.com/nexus/content/repositories/jcenter'}
    mavenCentral()
}

dependencies {
    implementation "org.springframeNwork.boot:spring-boot-starter-web:1.5.9.RELEASE"
    implementation "com.baomidou:mybatis-plus-boot-starter:2.3.1"
    testImplementation "org.springframework.boot:spring-boot-starter-test:1.5.9.RELEASE"
    testImplementation "junit:junit:4.10"
    testImplementation "com.h2database:h2:1.4.195"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
